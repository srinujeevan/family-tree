services:
  postgres:
    image: postgres:18-alpine
    container_name: family_tree_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: family_tree_app
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: family_tree_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_tree_app -d family_tree_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
