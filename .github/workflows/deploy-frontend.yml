name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Point the production build at the deployed backend. Set this under
      # Settings -> Secrets and variables -> Actions -> Variables -> API_BASE_URL
      # e.g. https://family-tree-api.onrender.com/api
      - name: Set production API URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::warning::Repository variable API_BASE_URL is not set - using the default in environment.prod.ts"
          else
            node -e '
              const fs = require("fs");
              const file = "src/environments/environment.prod.ts";
              const src = fs.readFileSync(file, "utf8");
              fs.writeFileSync(file, src.replace(/apiBaseUrl: .*/, "apiBaseUrl: " + JSON.stringify(process.env.API_BASE_URL) + ","));
            '
          fi
          cat src/environments/environment.prod.ts

      # Pages serves the site from /<repo-name>/, not from the domain root.
      - run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"

      # Pages has no SPA fallback: serving index.html as 404.html lets deep
      # links and page refreshes (e.g. /dashboard) load the Angular app.
      - run: cp dist/family-tree/browser/index.html dist/family-tree/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/family-tree/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
